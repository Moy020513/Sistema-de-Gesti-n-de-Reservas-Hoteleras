server:
  port: ${PORT}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: habitaciones
              uri: lb://habitaciones
              predicates:
                - Path=/api/habitaciones/**
              filters:
                - StripPrefix=2
            - id: huespedes
              uri: lb://huespedes
              predicates:
                - Path=/api/huespedes/**
              filters:
                - StripPrefix=2
    loadbalancer:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true