server:
  port: 8091

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: servicioa
              uri: lb://servicioa
              predicates:
                - Path=/api/a/**
              filters:
                - StripPrefix=2

    loadbalancer:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true